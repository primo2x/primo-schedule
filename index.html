<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Schedule</title>
<style>
  body { font-family: sans-serif; margin: 0; padding: 16px; color: #1f2d30; }
  .cal { max-width: 380px; margin: 0 auto; }
  header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 8px; }
  h2 { font-size: 16px; font-weight: 500; margin: 0; }
  button { border: 1px solid #c9d8dc; background: none; border-radius: 8px; padding: 4px 12px; font-size: 16px; }
  button:disabled { opacity: .35; }
  .dow, #grid { display: grid; grid-template-columns: repeat(7, 1fr); text-align: center; }
  .dow { font-size: 11px; color: #6b7f84; }
  .day { height: 40px; margin: 2px; display: flex; align-items: center; justify-content: center; border-radius: 8px; box-sizing: border-box; }
  .past { color: #aab8bc; }
  .busy { background: #96d9e6; color: #1f5560; font-weight: 500; }
  .today { border: 1px solid #6b7f84; }
  #msg, .note { font-size: 12px; color: #6b7f84; text-align: center; }
</style>
</head>
<body>
<div class="cal">
  <header>
    <button id="prev" aria-label="Previous month">‹</button>
    <h2 id="title"></h2>
    <button id="next" aria-label="Next month">›</button>
  </header>
  <div class="dow"><div>Sun</div><div>Mon</div><div>Tue</div><div>Wed</div><div>Thu</div><div>Fri</div><div>Sat</div></div>
  <div id="grid"></div>
  <p id="msg"></p>
  <p class="note">水色の日は予定が入っています</p>
</div>

<script>
const GAS_URL = 'https://script.google.com/macros/s/AKfycbwBpyGo-q3vVvkWSuysg7s53iLUSv7aFGFpZMxNIasynQv9Hwc4YHUl2eYsbWMthT4eHA/exec';
const KEY = location.hash.slice(1); // https://サイト/#合言葉

let busy = new Set();
let off = 0; // 今月からのずれ（0〜3）
const today = new Date();
const pad = n => String(n).padStart(2, '0');
const key = (y, m, d) => `${y}-${pad(m + 1)}-${pad(d)}`;

function render() {
  const cur = new Date(today.getFullYear(), today.getMonth() + off, 1);
  const y = cur.getFullYear(), m = cur.getMonth();
  document.getElementById('title').textContent =
    cur.toLocaleDateString('en-US', { month: 'long', year: 'numeric' });
  document.getElementById('prev').disabled = off === 0;
  document.getElementById('next').disabled = off === 3;

  const grid = document.getElementById('grid');
  grid.innerHTML = '';
  for (let i = 0; i < cur.getDay(); i++) grid.appendChild(document.createElement('div'));

  const last = new Date(y, m + 1, 0).getDate();
  const t0 = new Date(today.getFullYear(), today.getMonth(), today.getDate());
  for (let d = 1; d <= last; d++) {
    const c = document.createElement('div');
    const date = new Date(y, m, d);
    let cls = 'day';
    if (date < t0) cls += ' past';
    else if (busy.has(key(y, m, d))) cls += ' busy';
    if (date.getTime() === t0.getTime()) cls += ' today';
    c.className = cls;
    c.textContent = d;
    grid.appendChild(c);
  }
}

document.getElementById('prev').onclick = () => { off--; render(); };
document.getElementById('next').onclick = () => { off++; render(); };
render();

fetch(`${GAS_URL}?k=${encodeURIComponent(KEY)}`)
  .then(r => r.json())
  .then(data => {
    if (!Array.isArray(data)) throw new Error('forbidden');
    busy = new Set(data);
    render();
  })
  .catch(() => {
    document.getElementById('msg').textContent = '読み込めませんでした。リンクを確認してください';
  });
</script>
</body>
</html>
